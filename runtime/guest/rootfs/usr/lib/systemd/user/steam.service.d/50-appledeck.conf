# appledeck: keep the OS's Steam service and its health/bootstrap hooks.
# steamvr.service is masked at runtime; its stock Wants/After are harmless.
[Unit]
After=gamescope-session.service
Wants=appledeck-steam-cpu-name.service

[Service]
# appledeck: Gamescope WSI crashes Steam UI over Venus; zink uses X11/XCB.
Environment=ENABLE_GAMESCOPE_WSI=0
EnvironmentFile=-%t/appledeck-steam-cpu.env
UnsetEnvironment=STEAM_LAUNCH_WRAPPER_AFFINITY_LIST STEAM_DESKTOP_APP_AFFINITY_LIST
# KosmicKrisp implements unsigned min/max only, not every 64-bit atomic. Keep
# those features out of vkd3d-proton's default caps; DD2 opts back in per title.
# This must be inherited from Steam: steam-launch-wrapper unconditionally
# overwrites variables listed in gfx.txt, even a title's launch-option values.
# An explicit stock/user gfx.txt entry still wins and is deliberately left alone.
Environment=VKD3D_DISABLE_EXTENSIONS=VK_KHR_shader_atomic_int64,VK_EXT_shader_image_atomic_int64
TimeoutStopSec=10
# Migrate AppleDeck-owned compatibility registrations back to their base tools
# before anything below touches config.vdf.
ExecStartPre=-/usr/lib/appledeck/appledeck-compat-migrate
# These run after the stock ExecStartPre commands (including its cp -u).
ExecStartPre=/usr/lib/appledeck/steam-client
ExecStartPre=-/usr/lib/appledeck/steam-cpu-info
ExecStartPre=-/usr/lib/appledeck/steam-ui-display-sync
ExecStartPre=-/usr/lib/appledeck/appledeck-game-patches
# Bound the first host sync, then use one snapshot throughout this Steam start.
ExecStartPre=-/usr/lib/appledeck/steam-profiles-wait
# Patch the EAC-capable FEX into Steam's FEX-Emu tool; Steam tool updates are
# re-patched on the next Steam start.
ExecStartPre=-/usr/lib/appledeck/steam-fex-eac
ExecStartPre=-/usr/lib/appledeck/steam-gfx-env
ExecStartPre=-/usr/lib/appledeck/steam-shader-defaults
# Steam's idle screensaver off once per install: after a few minutes without input Steam sees
# (a long load, VR) it takes focus from the game (a later choice in Steam stays)
ExecStartPre=-/usr/lib/appledeck/steam-idle-screensaver
ExecStartPre=-/usr/lib/appledeck/mac-clock-format
ExecStartPre=-/usr/lib/appledeck/steam-title-defaults
ExecStartPost=/usr/lib/appledeck/steam-client --watch $MAINPID
